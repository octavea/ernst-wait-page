<style>
  :root {
    --bg: #000000;
    --ink: #F5F5F7;
    --muted: #A1A1A6;
    --faint: #6E6E73;
    --line: rgba(255, 255, 255, 0.10);
    --nav: rgba(22, 22, 23, 0.72);
    --accent: #2997FF;
    --accent-ink: #000000;
    --card: rgba(255, 255, 255, 0.04);
    --max: 1100px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Inter, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  a { color: inherit; text-decoration: none; }

  /* ---------- Navigation globale ---------- */
  .gnav {
    --fh: 0px;                                   /* hauteur du panneau déroulé */
    --ease: cubic-bezier(0.4, 0, 0.6, 1);
    --fly-ink: #E8E8ED;
    --fly-muted: #86868B;
    position: fixed; inset: 0 0 auto 0; z-index: 20; height: 44px;
  }
  .gnav-bg {
    position: absolute; inset: 0 0 auto 0;
    height: calc(44px + var(--fh));
    background: rgba(22, 22, 23, 0.72);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
    transition: height .32s var(--ease), background-color .32s var(--ease);
  }
  .gnav.is-open .gnav-bg { background: rgba(22, 22, 23, 0.98); }
  .gnav.is-mobile-open .gnav-bg { background: #161617; }
  .gnav-bar {
    position: relative; max-width: 1024px; height: 44px; margin: 0 auto; padding: 0 22px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 9px; color: var(--ink); height: 44px; transition: opacity .24s var(--ease); }
  .brand-lockup { height: 20px; width: auto; display: block; }

  .gnav-list { display: flex; align-items: center; height: 100%; list-style: none; margin: 0; padding: 0; }
  .gnav-item { position: relative; display: flex; align-items: center; height: 100%; }
  .gnav-link {
    display: flex; align-items: center; height: 100%; padding: 0 15px;
    font-size: 12px; letter-spacing: -0.01em; color: rgba(232, 232, 237, 0.8);
    transition: color .32s var(--ease);
  }
  .gnav-link:hover, .gnav-item.is-current .gnav-link { color: #FFFFFF; }
  /* bouton d'ouverture au clavier : invisible à la souris, apparaît au focus (comme chez Apple) */
  .gnav-chev {
    position: absolute; right: 1px; top: 50%; width: 14px; height: 14px; margin-top: -7px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: none; border: 0; border-radius: 3px; color: var(--fly-ink); cursor: pointer; opacity: 0;
  }
  .gnav-chev svg { width: 8px; height: 8px; transition: transform .32s var(--ease); }
  .gnav-chev:focus-visible { opacity: 1; outline: 2px solid var(--accent); outline-offset: 1px; }
  .gnav-chev[aria-expanded="true"] svg { transform: rotate(180deg); }

  .gnav-tools { display: flex; align-items: center; gap: 6px; height: 100%; }
  .gnav-icon {
    width: 40px; height: 44px; display: flex; align-items: center; justify-content: center;
    background: none; border: 0; padding: 0; color: rgba(232, 232, 237, 0.8); cursor: pointer;
    transition: color .32s var(--ease);
  }
  .gnav-icon:hover, .gnav-icon[aria-expanded="true"] { color: #FFFFFF; }
  .gnav-icon svg { width: 15px; height: 15px; }
  .gnav-cta {
    margin-left: 8px; font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 980px;
    background: var(--ink); color: #000; white-space: nowrap; transition: background .2s;
  }
  .gnav-cta:hover { background: #FFFFFF; }
  .gnav a:focus-visible, .gnav-icon:focus-visible, .gnav-burger:focus-visible, .gnav-back:focus-visible, .m-link:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px;
  }

  /* panneau déroulant (ordinateur) */
  .gnav-flyout {
    position: absolute; top: 44px; left: 0; right: 0; height: var(--fh); overflow: hidden;
    transition: height .32s var(--ease);
  }
  .gnav-menu { position: absolute; top: 0; left: 0; right: 0; visibility: hidden; transition: visibility 0s .24s; }
  .gnav-menu.is-active { visibility: visible; transition-delay: 0s; }
  .gnav-menu-inner {
    max-width: 1024px; margin: 0 auto; padding: 40px 22px 84px;
    display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(2, minmax(0, 1fr)); gap: 0 44px;
  }
  .gnav-col h2 { margin: 0 0 14px; font-size: 12px; font-weight: 400; letter-spacing: -0.01em; color: var(--fly-muted); }
  .gnav-col ul { list-style: none; margin: 0; padding: 0; }
  .gnav-col a {
    display: inline-block; padding: 4px 0; font-size: 12px; font-weight: 600; letter-spacing: -0.01em;
    color: var(--fly-ink); transition: color .2s;
  }
  .gnav-col.is-big a { font-size: 24px; line-height: 1.17; letter-spacing: 0.009em; padding: 4px 0 5px; }
  .gnav-col a:hover { color: #FFFFFF; }
  /* apparition échelonnée des éléments */
  .stg { opacity: 0; transform: translateY(-4px); transition: opacity .1s linear, transform .1s linear; }
  .is-active > * .stg, .is-active .stg {
    opacity: 1; transform: none;
    transition: opacity .24s var(--ease) var(--d, 0ms), transform .24s var(--ease) var(--d, 0ms);
  }

  /* recherche */
  .gnav-search-inner { max-width: 1024px; margin: 0 auto; padding: 38px 22px 76px; }
  .gnav-search-field { display: flex; align-items: center; gap: 12px; color: var(--fly-muted); }
  .gnav-search-field svg { width: 22px; height: 22px; flex: none; }
  .gnav-search-field input {
    flex: 1; min-width: 0; background: none; border: 0; outline: none; padding: 4px 0;
    font-family: inherit; font-size: 24px; font-weight: 600; line-height: 1.2; letter-spacing: 0.009em; color: var(--fly-ink);
  }
  .gnav-search-field input::placeholder { color: var(--fly-muted); }
  .gnav-search-field input::-webkit-search-cancel-button, .gnav-search-field input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
  .gnav-quick { margin-top: 36px; }
  .gnav-quick a { display: inline-flex; align-items: center; gap: 10px; }
  .gnav-quick a svg { width: 10px; height: 10px; color: var(--fly-muted); }

  /* voile flouté sur la page */
  .gnav-curtain {
    position: fixed; inset: 0; z-index: 19; background: rgba(0, 0, 0, 0.42);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    opacity: 0; visibility: hidden; transition: opacity .32s var(--ease), visibility 0s .32s;
  }
  .gnav-curtain.is-visible { opacity: 1; visibility: visible; transition-delay: 0s; }

  /* mobile */
  .gnav-burger, .gnav-back { display: none; }
  .gnav-burger {
    position: relative; width: 44px; height: 44px; margin-right: -12px; padding: 0;
    background: none; border: 0; cursor: pointer;
  }
  .gnav-burger span {
    position: absolute; left: 14px; top: 21px; width: 16px; height: 1.4px; border-radius: 1px; background: var(--fly-ink);
    transition: transform .32s var(--ease);
  }
  .gnav-burger span:first-child { transform: translateY(-3.5px); }
  .gnav-burger span:last-child { transform: translateY(3.5px); }
  .gnav.is-mobile-open .gnav-burger span:first-child { transform: rotate(45deg); }
  .gnav.is-mobile-open .gnav-burger span:last-child { transform: rotate(-45deg); }
  .gnav-back {
    position: absolute; left: 10px; top: 0; width: 44px; height: 44px; padding: 0;
    align-items: center; justify-content: center; background: none; border: 0; color: var(--fly-ink); cursor: pointer;
    opacity: 0; visibility: hidden; transition: opacity .24s var(--ease), visibility 0s .24s;
  }
  .gnav-back svg { width: 9px; height: 15px; }
  .gnav.is-sub .gnav-back { opacity: 1; visibility: visible; transition-delay: 0s; }
  .gnav.is-sub .brand { opacity: 0; pointer-events: none; }
  .gnav-mobile {
    display: none; position: fixed; top: 44px; left: 0; right: 0; bottom: 0; overflow: hidden;
    visibility: hidden; transition: visibility 0s .32s;
  }
  .gnav.is-mobile-open .gnav-mobile { visibility: visible; transition-delay: 0s; }
  .m-level {
    position: absolute; inset: 0; overflow-y: auto; padding: 20px 48px 48px;
    visibility: hidden; transition: transform .32s var(--ease), visibility 0s .32s;
  }
  .m-level.is-active { visibility: visible; transition-delay: 0s; }
  .m-level.is-left { transform: translateX(-28px); }
  .m-level.is-right { transform: translateX(28px); }
  .m-level ul { list-style: none; margin: 0; padding: 0; }
  .m-link {
    display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 6px 0;
    background: none; border: 0; text-align: left; cursor: pointer;
    font-family: inherit; font-size: 28px; font-weight: 600; line-height: 1.14; letter-spacing: 0.007em; color: var(--fly-ink);
  }
  .m-link svg { width: 9px; height: 15px; color: var(--fly-muted); }
  .m-cta { display: inline-flex; margin-top: 28px; padding: 10px 18px; border-radius: 980px; background: var(--ink); color: #000; font-size: 15px; font-weight: 500; }
  .m-col { margin-bottom: 28px; }
  .m-col h2 { margin: 0 0 10px; font-size: 17px; font-weight: 400; color: var(--fly-muted); }
  .m-col a { display: block; padding: 4px 0; font-size: 17px; font-weight: 600; color: var(--fly-ink); }
  .m-col.is-big a { font-size: 28px; line-height: 1.14; letter-spacing: 0.007em; padding: 5px 0; }
  .m-level .gnav-search-field input { font-size: 22px; }
  @media (max-width: 833px) {
    .gnav-list, .gnav-cta, .gnav-flyout, .gnav-curtain { display: none; }
    .gnav-burger, .gnav-back { display: flex; }
    .gnav-mobile { display: block; }
  }
  @media (max-width: 480px) {
    .m-level { padding: 16px 32px 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .gnav *, .gnav-bg, .gnav-curtain { transition-duration: 0s !important; transition-delay: 0s !important; }
  }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* ---------- Fond animé ---------- */
  /* la carte appartient au héro : elle défile avec lui */
  #waves { position: absolute; top: 0; left: 0; width: 100%; height: var(--hero-h, 100vh); z-index: 0; pointer-events: none; }
  .veil {
    position: absolute; top: 0; left: 0; width: 100%; height: var(--hero-h, 100vh); z-index: 1; pointer-events: none;
    background:
      radial-gradient(ellipse 50% 40% at 50% 42%, rgba(0,0,0,0.55) 0%, transparent 100%),
      radial-gradient(ellipse 100% 80% at 50% 50%, transparent 40%, rgba(0,0,0,0.75) 100%);
  }
  main, footer { position: relative; z-index: 2; }

  /* ---------- Héro ---------- */
  .hero {
    min-height: 100vh; padding: 140px 22px 96px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 18px; }
  h1 {
    margin: 0; max-width: 860px;
    font-size: clamp(40px, 7vw, 80px); line-height: 1.04; letter-spacing: -0.035em; font-weight: 700;
  }
  .lead { margin: 22px 0 0; max-width: 620px; font-size: clamp(17px, 2vw, 21px); color: var(--muted); }
  .actions { margin-top: 36px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; padding: 0 22px; border-radius: 980px; font-size: 16px; font-weight: 500;
    transition: transform .2s, background .2s, color .2s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-ghost { border: 1px solid rgba(255,255,255,0.28); color: var(--ink); }
  .btn-ghost:hover { background: rgba(255,255,255,0.08); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ---------- Atouts ---------- */
  .section { max-width: var(--max); margin: 0 auto; padding: 40px 22px 120px; }
  .section h2 { margin: 0 0 40px; font-size: clamp(28px, 4vw, 44px); letter-spacing: -0.025em; line-height: 1.1; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
  .card {
    padding: 32px 28px; border-radius: 22px; background: var(--card);
    border: 1px solid var(--line); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .card .num { font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .card h3 { margin: 10px 0 8px; font-size: 21px; letter-spacing: -0.015em; }
  .card p { margin: 0; color: var(--muted); font-size: 15px; }

  /* ---------- Pied de page ---------- */
  footer { border-top: 1px solid var(--line); }
  .footer-inner {
    max-width: var(--max); margin: 0 auto; padding: 22px; display: flex; flex-wrap: wrap; gap: 12px 24px;
    justify-content: space-between; font-size: 12px; color: var(--faint);
  }
  .footer-inner nav { display: flex; gap: 20px; }
  .footer-inner a:hover { color: var(--ink); }

  /* ---------- Mobile ---------- */
  @media (max-width: 760px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
  /* ---------- Hadrian, la chouette ---------- */
  .owl { position: absolute; --owl-ink: #F5F5F7; --owl-bg: #000000; }
  .owl svg { display: block; width: 100%; height: auto; overflow: visible; }
  .owl-fill { fill: var(--owl-ink); }
  .owl-pupil .p { fill: var(--owl-ink); }
  .owl-pupil .h { fill: var(--owl-bg); }
  .owl-lid { fill: var(--owl-ink); transform-box: fill-box; transform-origin: 50% 0; transform: scaleY(0); transition: transform .1s ease-in; }
  .owl-lid.is-closed { transform: scaleY(1); transition: transform .07s ease-out; }
  .owl-hop { transition: transform .5s cubic-bezier(.34, 1.56, .64, 1); }
  .owl:hover .owl-hop { transform: translateY(-6px); }
  /* perchée sur le bord d'une carte : elle surgit de derrière au premier passage */
  .card-perch { position: relative; }
  .perch { position: absolute; left: 14px; bottom: 100%; width: 84px; height: 116px; margin-bottom: -3px; overflow: hidden; pointer-events: none; }
  .perch .owl { left: 12px; right: 12px; bottom: 0; pointer-events: auto; transform: translateY(105%); transition: transform .9s cubic-bezier(.22, 1, .36, 1); }
  .perch.is-in .owl { transform: none; }
  /* section de clôture */
  .closing { position: relative; z-index: 2; padding: 150px 22px 140px; text-align: center; }
  .closing-inner { max-width: 720px; margin: 0 auto; }
  .branch { position: relative; width: min(600px, 100%); aspect-ratio: 10 / 1; margin: 0 auto 36px; }
  .branch > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .branch > svg path { fill: none; stroke-linecap: round; }
  .branch .owl { left: 50%; bottom: calc(63.33% - 5px); width: 92px; margin-left: -46px; opacity: 0; transform: translateY(12px); transition: opacity .8s ease, transform .9s cubic-bezier(.22, 1, .36, 1); }
  .branch.is-in .owl { opacity: 1; transform: none; }
  .closing h2 { margin: 0; font-size: clamp(36px, 5.6vw, 64px); line-height: 1.06; letter-spacing: -0.03em; }
  .closing .lead { margin: 20px auto 0; }
  .closing .actions { margin-top: 32px; }
  @media (max-width: 760px) {
    .section h2 { margin-bottom: 104px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .owl-hop, .perch .owl, .branch .owl, .owl-lid { transition: none !important; }
  }

  /* ---------- La carte s'arrête net au bas du héro ; sections suivantes opaques ---------- */
  :root { --sec: #000000; --card-solid: #161617; }
  #atouts, .closing, footer {
    background: var(--sec);
    box-shadow: 0 0 0 100vmax var(--sec); clip-path: inset(0 -100vmax);
  }
  .card { background: var(--card-solid); backdrop-filter: none; -webkit-backdrop-filter: none; }

  /* ---------- Thème clair : suit le réglage du système ---------- */
  @media (prefers-color-scheme: light) {
    :root {

    let w = 0, h = 0, dpr = 1, raf = 0, last = 0, t0 = performance.now();

    let mobile = false, labels = [], points = [], links = [], lastSpawn = -Infinity;
    const rand = (a, b) => a + Math.random() * (b - a);

    // Bloc de texte du héros, mesuré dans la page : aucune inscription ne s'y pose.
    let heroBox = null;
    function measureHero() {
      const el = document.querySelector(".hero");
      if (!el) return;
      const oy = canvas.getBoundingClientRect().top;   // repère du canevas, qui défile avec la page
      const r = [...el.children].map((c) => { const b = c.getBoundingClientRect(); return { left: b.left, right: b.right, top: b.top - oy, bottom: b.bottom - oy }; });
      // sur mobile, le texte occupe toute la largeur : on protège la bande entière, avec une marge plus généreuse
      const pad = mobile ? 64 : 28;
      heroBox = [mobile ? -1 : Math.min(...r.map((b) => b.left)) - pad, Math.min(...r.map((b) => b.top)) - pad,
                 mobile ? w + 1 : Math.max(...r.map((b) => b.right)) + pad, Math.max(...r.map((b) => b.bottom)) + pad];
      // autres blocs de texte à garder dégagés (titres, cartes, section de clôture)
      clearBoxes = [...document.querySelectorAll("[data-clear]")].map((n) => { const b = n.getBoundingClientRect(); return { left: b.left, right: b.right, top: b.top - oy, bottom: b.bottom - oy }; })
        .filter((b) => b.bottom > -40 && b.top < h + 40).map((b) => [b.left - 20, b.top - 20, b.right + 20, b.bottom + 20]);
    }
    let clearBoxes = [], ticks = 0;
    const inBox = (b, x, y) => x > b[0] && x < b[2] && y > b[1] && y < b[3];
    const inHero = (x, y) => (heroBox && inBox(heroBox, x, y)) || clearBoxes.some((b) => inBox(b, x, y));
    window.addEventListener("scroll", measureHero, { passive: true });

    const hero = document.querySelector(".hero");
    function syncHeight() { document.documentElement.style.setProperty("--hero-h", hero.offsetHeight + "px"); }
    function resize() {
      syncHeight();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = canvas.clientWidth; h = canvas.clientHeight;
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cols = Math.ceil(w / CELL) + 3; rows = Math.ceil(h / CELL) + 3;
      grid = new Float32Array(cols * rows);
      mobile = w < 760;
      const now = performance.now();
      const names = mobile ? [NAME_ANCHORS[0], NAME_ANCHORS[1], NAME_ANCHORS[4], NAME_ANCHORS[5]] : NAME_ANCHORS;
      const sectors = mobile ? [[0.5, 0.2], [0.5, 0.9]] : SECTOR_ANCHORS;
      labels = [
        ...names.map(([fx, fy]) => ({ kind: "name", fx, fy })),
        ...sectors.map(([fx, fy]) => ({ kind: "sector", fx, fy })),
      ].map((l, i) => ({ ...l, text: "", widths: null, total: 0, state: "search", alpha: 0,
        born: now, life: rand(...LIFE), delay: now + i * 650, spot: null, dir: 0, x: 0, y: 0, ax: 0, ay: 0 }));
      points = []; links = []; lastSpawn = -Infinity;
    }

    // ---------- Relief et courbes ----------
    function sample(t) {
      gmin = Infinity; gmax = -Infinity;
      for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
        const v = field((i - 1) * CELL, (j - 1) * CELL, t);
        grid[j * cols + i] = v;
        if (v < gmin) gmin = v;
        if (v > gmax) gmax = v;
      }
    }
    function contour(iso) {
      const segs = [];
      for (let j = 0; j < rows - 1; j++) for (let i = 0; i < cols - 1; i++) {
        const a = grid[j * cols + i], b = grid[j * cols + i + 1];
        const c = grid[(j + 1) * cols + i + 1], d = grid[(j + 1) * cols + i];
        const idx = (a > iso ? 8 : 0) | (b > iso ? 4 : 0) | (c > iso ? 2 : 0) | (d > iso ? 1 : 0);
        if (idx === 0 || idx === 15) continue;
        const x = (i - 1) * CELL, y = (j - 1) * CELL;
        const T = [x + CELL * (iso - a) / (b - a), y], R = [x + CELL, y + CELL * (iso - b) / (c - b)];
        const B = [x + CELL * (iso - d) / (c - d), y + CELL], L = [x, y + CELL * (iso - a) / (d - a)];
        const s = (p, q) => segs.push(p[0], p[1], q[0], q[1]);
        switch (idx) {
          case 1: case 14: s(L, B); break;
          case 2: case 13: s(B, R); break;
          case 3: case 12: s(L, R); break;
          case 4: case 11: s(T, R); break;
          case 6: case 9: s(T, B); break;
          case 7: case 8: s(L, T); break;
          case 5: s(L, T); s(B, R); break;
          case 10: s(T, R); s(L, B); break;
        }
      }
      return segs;
    }
    function chaikin(p, closed) {
      const out = closed ? [] : [p[0]];
      for (let i = 0; i < p.length - 1; i++) {
        const [x0, y0] = p[i], [x1, y1] = p[i + 1];
        out.push([0.75 * x0 + 0.25 * x1, 0.75 * y0 + 0.25 * y1], [0.25 * x0 + 0.75 * x1, 0.25 * y0 + 0.75 * y1]);
      }
      out.push(closed ? out[0] : p[p.length - 1]);
      return out;
    }
    // Recolle les segments en lignes continues, puis les lisse : le tracé affiché
    // et le tracé sur lequel s'écrivent les lettres sont exactement les mêmes.
    function polylines(segs) {
      const key = (x, y) => Math.round(x * 64) * 100003 + Math.round(y * 64);
      const n = segs.length / 4, ends = new Map(), used = new Uint8Array(n);
      for (let k = 0; k < n; k++) for (const e of [0, 2]) {
        const kk = key(segs[k * 4 + e], segs[k * 4 + e + 1]);
        let arr = ends.get(kk); if (!arr) ends.set(kk, (arr = []));
        arr.push(k);
      }
      const other = (k, x, y) => key(segs[k * 4], segs[k * 4 + 1]) === key(x, y)
        ? [segs[k * 4 + 2], segs[k * 4 + 3]] : [segs[k * 4], segs[k * 4 + 1]];
      const extend = (pts) => {
        for (;;) {
          const [x, y] = pts[pts.length - 1];
          const next = (ends.get(key(x, y)) || []).find((k) => !used[k]);
          if (next === undefined) return;
          used[next] = 1; pts.push(other(next, x, y));
        }
      };
      const lines = [];
      for (let k = 0; k < n; k++) {
        if (used[k]) continue;
        used[k] = 1;
        const fwd = [[segs[k * 4], segs[k * 4 + 1]], [segs[k * 4 + 2], segs[k * 4 + 3]]];
        extend(fwd);
        const back = [fwd[0]];
        extend(back);
        let pts = back.reverse().concat(fwd.slice(1));
        if (pts.length < 3) continue;
        const f = pts[0], l = pts[pts.length - 1];
        const closed = Math.hypot(f[0] - l[0], f[1] - l[1]) < 0.01;
        pts = chaikin(chaikin(chaikin(pts, closed), closed), closed);
        const cum = [0];
        for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
        lines.push({ pts, cum, len: cum[cum.length - 1] });
      }
      return lines;
    }
    function at(line, s) {
      const { pts, cum } = line;
      s = Math.max(0, Math.min(line.len, s));
      let lo = 0, hi = cum.length - 1;
      while (hi - lo > 1) { const mid = (lo + hi) >> 1; cum[mid] <= s ? (lo = mid) : (hi = mid); }
      const span = cum[hi] - cum[lo] || 1, f = (s - cum[lo]) / span;
      const [x0, y0] = pts[lo], [x1, y1] = pts[hi];
      return [x0 + (x1 - x0) * f, y0 + (y1 - y0) * f];
    }
    function tangent(line, s, half = 4) {
      const a = at(line, s - half), b = at(line, s + half);
      return Math.atan2(b[1] - a[1], b[0] - a[0]);
    }
    function project(line, px, py) {
      const { pts, cum } = line;
      let best = Infinity, bs = 0;
      for (let i = 0; i < pts.length - 1; i++) {
        const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
        const dx = x1 - x0, dy = y1 - y0, l2 = dx * dx + dy * dy || 1;
        const f = Math.max(0, Math.min(1, ((px - x0) * dx + (py - y0) * dy) / l2));
        const d = (x0 + dx * f - px) ** 2 + (y0 + dy * f - py) ** 2;
        if (d < best) { best = d; bs = cum[i] + f * (cum[i + 1] - cum[i]); }
      }
      return [bs, Math.sqrt(best)];
    }

    // ---------- Inscriptions le long des courbes ----------

    function measure(lb) {
      ctx.font = STYLE[lb.kind].font;
      if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
      lb.widths = [...lb.text].map((ch) => ctx.measureText(ch).width);
      lb.total = lb.widths.reduce((a, b) => a + b, 0) + STYLE[lb.kind].track * (lb.widths.length - 1);
    }
    function pickName(lb) {
      const shown = new Set(labels.map((l) => l.text));
      const pool = lb.kind === "name" ? NAMES : SECTORS;
      const free = pool.map((t) => t.toUpperCase()).filter((t) => !shown.has(t));
      lb.text = free[Math.floor(Math.random() * free.length)];
      measure(lb);
    }
    function reAnchor(lb) {
      // l'emplacement varie un peu à chaque renaissance
      lb.ax = Math.max(80, Math.min(w - 80, lb.fx * w + rand(-50, 50)));
      lb.ay = Math.max(110, Math.min(h - 60, lb.fy * h + rand(-40, 40)));
    }
    // Toute l'étendue du mot reste hors du titre, loin des bords et des autres inscriptions.
    function clear(line, s, L, self) {
      for (let k = 0; k <= 8; k++) {
        const [x, y] = at(line, s - L / 2 - 6 + ((L + 12) * k) / 8);
        if (x < 36 || x > w - 36 || y < 44 + 30 || y > h - 28 || inHero(x, y)) return false;
        for (const p of points) {
          if (Math.hypot(x - p.x, y - p.y) < 46) return false;
          const b = p.box;
          if (b && x > b[0] - 12 && x < b[2] + 12 && y > b[1] - 12 && y < b[3] + 12) return false;
        }
        for (const o of labels) {
          if (o === self || !o.glyphs || o.alpha < 0.02) continue;
          for (const [gx, gy] of o.glyphs) if (Math.abs(gx - x) < 18 && Math.abs(gy - y) < 18) return false;
        }
      }
      return true;
    }
    function smooth(line, s, L) {
      if (s - L / 2 - 10 < 0 || s + L / 2 + 10 > line.len) return false;
      let prev = tangent(line, s - L / 2), turn = 0;
      for (let k = 1; k <= 10; k++) {
        const a = tangent(line, s - L / 2 + (L * k) / 10);
        const da = Math.atan2(Math.sin(a - prev), Math.cos(a - prev));
        turn += da; prev = a;
        if (Math.abs(da) > MAX_BEND || Math.abs(turn) > 0.9) return false;
      }
      return true;
    }

    function updateLabels(lines, now, instant) {
      for (const lb of labels) {
        if (!lb.text) { pickName(lb); reAnchor(lb); }
        if (lb.state === "out" && lb.alpha <= 0.01) {
          pickName(lb);
          reAnchor(lb);
          Object.assign(lb, { state: "search", spot: null, glyphs: null, dir: 0, quick: false });
        }
        if (lb.state === "search") {
          if (now < lb.delay && !instant) continue;
          const L = lb.total;
          let best = null, bestD = 110;
          for (const line of lines) {
            if (line.len < L + 40) continue;
            for (let s = L / 2 + 12; s < line.len - L / 2 - 12; s += 6) {
              const [cx, cy] = at(line, s);
              const d = Math.hypot(cx - lb.ax, cy - lb.ay);
              if (d >= bestD) continue;
              if (smooth(line, s, L) && clear(line, s, L, lb)) { bestD = d; best = { line, s }; }
            }
          }
          if (best) {
            lb.spot = best; [lb.x, lb.y] = at(best.line, best.s);
            Object.assign(lb, { state: "in", born: now, life: rand(...LIFE) });
          } else continue;
        } else {
          // Rester accroché : projection continue du point de l'image précédente sur la courbe actuelle.
          const L = lb.total;
          let spot = null, bestD = 18;
          for (const line of lines) {
            if (line.len < L + 40) continue;
            const [ps, d] = project(line, lb.x, lb.y);
            if (d < bestD && smooth(line, ps, L) && clear(line, ps, L, lb)) { bestD = d; spot = { line, s: ps }; }
          }
          if (spot) { lb.spot = spot; [lb.x, lb.y] = at(spot.line, spot.s); }
          else if (lb.state !== "out") Object.assign(lb, { state: "out", quick: true });
          if (lb.state !== "out" && now - lb.born > lb.life && !instant) lb.state = "out";
        }
        lb.alpha = instant ? 1 : lb.state === "out"
          ? Math.max(0, lb.alpha - (lb.quick ? 0.12 : 0.025)) : Math.min(1, lb.alpha + 0.025);
        if (lb.state === "in" && lb.alpha >= 1) lb.state = "hold";
        if (lb.quick && lb.state === "out") continue;   // courbe perdue : on s'efface sans bouger

        // Lettres posées exactement sur la courbe, chacune selon la pente locale.
        const L = lb.total, { line, s } = lb.spot, tr = STYLE[lb.kind].track;
        const p0 = at(line, s - L / 2), p1 = at(line, s + L / 2), dx = p1[0] - p0[0];
        if (!lb.dir) lb.dir = dx >= 0 ? 1 : -1;
        else if (dx * lb.dir < -0.35 * L) lb.dir = -lb.dir;   // sens de lecture : de gauche à droite
        const dir = lb.dir, s0 = s - (dir * L) / 2;
        const g = []; let off = 0;
        lb.widths.forEach((wch) => {
          const ss = s0 + dir * (off + wch / 2), [x, y] = at(line, ss);
          g.push([x, y, tangent(line, ss) + (dir === 1 ? 0 : Math.PI)]);
          off += wch + tr;
        });
        lb.glyphs = g;
        lb.path = [];
        for (let k = 0; k <= 16; k++) lb.path.push(at(line, s - L / 2 - 5 + ((L + 10) * k) / 16));
      }
    }
    function drawLabels() {
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
      for (const lb of labels) {
        if (!lb.glyphs || lb.alpha <= 0.01) continue;
        const st = STYLE[lb.kind];
        ctx.globalAlpha = lb.alpha;
        // la courbe s'interrompt sous le mot, en suivant exactement son tracé
        ctx.globalCompositeOperation = "destination-out";
        ctx.lineWidth = lb.kind === "name" ? 13 : 12; ctx.lineCap = "round"; ctx.lineJoin = "round";
        ctx.beginPath();
        lb.path.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
        ctx.stroke();
        ctx.globalCompositeOperation = "source-over";
        ctx.font = st.font; ctx.fillStyle = st.color;
        [...lb.text].forEach((ch, i) => {
          const [x, y, a] = lb.glyphs[i];
          ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.fillText(ch, 0, 0.5); ctx.restore();
        });
      }
      ctx.globalAlpha = 1;
    }

    // ---------- Points d'intérêt sur les sommets ----------
    function summits() {
      const out = [], thr = gmin + (gmax - gmin) * 0.5, r = 4;
      for (let j = r; j < rows - r; j++) for (let i = r; i < cols - r; i++) {
        const v = grid[j * cols + i];
        if (v < thr) continue;
        let top = true;
        for (let dj = -r; dj <= r && top; dj++) for (let di = -r; di <= r; di++) {
          if ((di || dj) && grid[(j + dj) * cols + i + di] >= v) { top = false; break; }
        }
        if (!top) continue;
        // affinage sous-maille : le point se pose exactement au sommet
        const l = grid[j * cols + i - 1], rr = grid[j * cols + i + 1];
        const u = grid[(j - 1) * cols + i], d = grid[(j + 1) * cols + i];
        const ox = (l - rr) / (2 * (l - 2 * v + rr) || 1), oy = (u - d) / (2 * (u - 2 * v + d) || 1);
        out.push([(i - 1 + ox) * CELL, (j - 1 + oy) * CELL]);
      }
      return out;
    }
    // Centres des petites courbes fermées : mamelons et cuvettes.
    function loopCentres(majors) {
      const out = [];
      for (const { pts, len } of majors) {
        const f = pts[0], l = pts[pts.length - 1];
        if (len > 520 || len < 60 || Math.hypot(f[0] - l[0], f[1] - l[1]) > 0.5) continue;
        let cx = 0, cy = 0;
        for (const [x, y] of pts) { cx += x; cy += y; }
        out.push([cx / pts.length, cy / pts.length]);
      }
      return out;
    }

    const TITLE_FONT = '600 10px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Inter, Arial, sans-serif';
    const SUB_FONT = '500 9px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    const setFont = (f, sp) => { ctx.font = f; if ("letterSpacing" in ctx) ctx.letterSpacing = sp; };
    // Mise en page de l'étiquette d'un point (coordonnées relatives au point).
    function tagLayout(x, title, sub) {
      setFont(TITLE_FONT, "1.4px"); const tw = ctx.measureText(title).width;
      setFont(SUB_FONT, "0.8px"); const sw = ctx.measureText(sub).width;
      const bw = Math.max(tw, sw) + 12, r = 8;
      if (mobile) {
        const cx = Math.max(10 + bw / 2 - x, Math.min(w - 10 - bw / 2 - x, 0));
        return { bw, align: "center", tx: cx, ty1: r + 22, ty2: r + 34, bx: cx - bw / 2, by: r + 11,
                 leader: [[0, r + 2], [0, r + 9]] };
      }
      const side = x + 210 > w ? -1 : 1;
      const lx = side * (r + 9), ly = -(r + 9), hx = lx + side * 18;
      return { bw, align: side === 1 ? "left" : "right", tx: side === 1 ? hx + 8 : hx - 8, ty1: ly + 3, ty2: ly + 15,
               bx: side === 1 ? hx + 4 : hx - 4 - bw, by: ly - 13, leader: [[side * r * 0.72, -r * 0.72], [lx, ly], [hx, ly]] };
    }
    function tagFits(x, y, title, sub) {
      const L = tagLayout(x, title, sub);
      const b = [x + L.bx - 4, y + L.by - 4, x + L.bx + L.bw + 4, y + L.by + 34];
      if (b[0] < 6 || b[2] > w - 6 || b[1] < 50 || b[3] > h - 30) return false;
      for (const c of heroBox ? [heroBox, ...clearBoxes] : clearBoxes) if (!(b[2] < c[0] || b[0] > c[2] || b[3] < c[1] || b[1] > c[3])) return false;
      return true;
    }
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

    function updatePoints(now, instant, majors) {
      const tops = summits().concat(loopCentres(majors));
      for (const p of points) {
        let best = null, bd = 60;
        for (const [x, y] of tops) { const d = Math.hypot(x - p.x, y - p.y); if (d < bd) { bd = d; best = [x, y]; } }
        // le point suit son sommet en douceur ; si le sommet s'efface, il reste en place
        if (best) { p.x += (best[0] - p.x) * 0.06; p.y += (best[1] - p.y) * 0.06; }
        if (!p.dying && !instant && (now - p.born > POINT_LIFE || !tagFits(p.x, p.y, p.title, p.sub))) { p.dying = true; p.deathAt = now; }
      }
      points = points.filter((p) => !p.dying || now - p.deathAt < 1200);
      links = links.filter((k) => points.includes(k.a) && points.includes(k.b));

      const alive = points.filter((p) => !p.dying);
      const ending = alive.filter((p) => now - p.born > POINT_LIFE - 4500).length;
      const want = instant ? alive.length < MAX_POINTS
        : alive.length - ending < MAX_POINTS && alive.length <= MAX_POINTS
          && (now - lastSpawn > POINT_EVERY || alive.length - ending === 0);
      if (!want) return;
      const free = ([x, y], m, gap, lab) => x > m && x < w - m && y > 44 + m && y < h - m * 0.6 && !inHero(x, y)
        && alive.every((p) => Math.hypot(p.x - x, p.y - y) > gap)
        && labels.every((lb) => !lb.glyphs || lb.alpha < 0.05 || lb.glyphs.every(([gx, gy]) => Math.hypot(gx - x, gy - y) > lab));
      const m = mobile ? 46 : 110;
      let ok = tops.filter((p) => free(p, m, mobile ? 180 : 320, 90));
      if (!ok.length) ok = tops.filter((p) => free(p, m * 0.75, mobile ? 140 : 200, 55));
      if (!ok.length && (mobile || !alive.length)) ok = tops.filter((p) => free(p, 40, 140, 50));
      if (!ok.length && mobile) {
        const flanks = [];
        for (const ln of majors) for (let d = 30; d < ln.len - 30; d += 60) flanks.push(at(ln, d));
        ok = flanks.filter((p) => free(p, 40, 140, 50) && p[1] > 110 && p[1] < h - 90);
      }
      const used = new Set(points.map((p) => p.title));
      const title = pick(POINTS.map((t) => t.toUpperCase()).filter((t) => !used.has(t)));
      const sub = pick(SECTORS).toUpperCase();
      ok = ok.filter(([x, y]) => tagFits(x, y, title, sub));
      if (!ok.length) return;
      // couvrir le terrain : on privilégie les sommets éloignés des points en place
      const far = (q) => Math.min(Infinity, ...alive.map((p) => Math.hypot(p.x - q[0], p.y - q[1])));
      ok.sort((a, b) => far(b) - far(a));
      const [x, y] = ok[Math.floor(Math.random() * Math.min(3, ok.length))];
      const pt = { x, y, title, sub, born: instant ? now - 2000 : now, dying: false, deathAt: 0, box: null };
      if (alive.length) links.push({ a: alive[alive.length - 1], b: pt, born: instant ? now - 5000 : now });
      points.push(pt); lastSpawn = now;
    }

    const easeOut = (t) => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
    function linkBlocked(x, y) {
      if (inHero(x, y)) return true;
      for (const p of points) { const b = p.box; if (b && x > b[0] - 6 && x < b[2] + 6 && y > b[1] - 6 && y < b[3] + 6) return true; }
      for (const lb of labels) {
        if (!lb.glyphs || lb.alpha < 0.05) continue;
        for (const [gx, gy] of lb.glyphs) if (Math.abs(gx - x) < 11 && Math.abs(gy - y) < 11) return true;
      }
      return false;
    }
    function drawPoints(now) {
      // liaisons : arc en pointillés, tracé progressivement, levé au passage des textes
      for (const k of links) {
        const prog = easeOut((now - k.born) / 2400);
        const fa = k.a.dying ? 1 - (now - k.a.deathAt) / 1200 : 1, fb = k.b.dying ? 1 - (now - k.b.deathAt) / 1200 : 1;
        const alpha = 0.45 * Math.max(0, Math.min(fa, fb));
        if (alpha <= 0) continue;
        const { x: x0, y: y0 } = k.a, { x: x1, y: y1 } = k.b;
        const len = Math.hypot(x1 - x0, y1 - y0) || 1;
        const cx = (x0 + x1) / 2 - ((y1 - y0) / len) * len * 0.18, cy = (y0 + y1) / 2 + ((x1 - x0) / len) * len * 0.18;
        ctx.save();
        ctx.strokeStyle = `rgba(${ACCENT}, ${alpha})`;
        ctx.lineWidth = 1; ctx.setLineDash([2, 5]); ctx.lineCap = "round";
        ctx.beginPath();
        const N = 72, upto = Math.max(1, Math.round(N * prog));
        for (let i = 0; i <= upto; i++) {
          const t = i / N, u = 1 - t;
          const x = u * u * x0 + 2 * u * t * cx + t * t * x1, y = u * u * y0 + 2 * u * t * cy + t * t * y1;
          if (Math.hypot(x - x0, y - y0) < 16 || Math.hypot(x - x1, y - y1) < 16 || linkBlocked(x, y)) { ctx.moveTo(x, y); continue; }
          ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.restore();
      }
      for (const p of points) {
        const age = now - p.born, appear = easeOut(age / 1400);
        const alpha = p.dying ? Math.max(0, 1 - (now - p.deathAt) / 1200) : appear;
        if (alpha <= 0) continue;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.globalAlpha = alpha;
        // les courbes s'écartent autour du point
        ctx.globalCompositeOperation = "destination-out";
        ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fill();
        ctx.globalCompositeOperation = "source-over";
        // halo qui respire lentement
        const breath = 0.5 + 0.5 * Math.sin((age / 3200) * Math.PI * 2);
        ctx.fillStyle = `rgba(${ACCENT}, ${0.10 + 0.08 * breath})`;
        ctx.beginPath(); ctx.arc(0, 0, 8 + 2.5 * breath, 0, Math.PI * 2); ctx.fill();
        // point cerclé
        ctx.strokeStyle = `rgba(${ACCENT}, 0.9)`; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(0, 0, 5.5 * appear + 1, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = `rgba(${ACCENT}, 1)`;
        ctx.beginPath(); ctx.arc(0, 0, 2.6, 0, Math.PI * 2); ctx.fill();
        // étiquette
        const { bw, align, tx, ty1, ty2, bx, by, leader } = tagLayout(p.x, p.title, p.sub);
        ctx.strokeStyle = `rgba(${INK}, 0.45)`; ctx.lineWidth = 1;
        ctx.beginPath();
        leader.forEach(([lx, ly], i) => (i ? ctx.lineTo(lx, ly) : ctx.moveTo(lx, ly)));
        ctx.stroke();
        p.box = [p.x + bx - 2, p.y + by, p.x + bx + bw + 2, p.y + by + 30];
        ctx.globalCompositeOperation = "destination-out";
        ctx.fillRect(bx - 2, by, bw + 4, 30);
        ctx.globalCompositeOperation = "source-over";
        ctx.textAlign = align; ctx.textBaseline = "alphabetic";
        setFont(TITLE_FONT, "1.4px");
        ctx.fillStyle = PAL.title;
        ctx.fillText(p.title, tx, ty1);
        setFont(SUB_FONT, "0.8px");
        ctx.fillStyle = `rgba(${ACCENT}, ${PAL.sub})`;
        ctx.fillText(p.sub, tx, ty2);
        ctx.restore();
      }
      if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
    }

    // ---------- Image ----------
    function draw(t, now, instant = false) {
      ctx.clearRect(0, 0, w, h);
      sample(t);
      let majors = [];
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      for (let l = 1; l <= LEVELS; l++) {
        const iso = gmin + (gmax - gmin) * (l / (LEVELS + 1));
        const major = l % MAJOR === 0;
        const lines = polylines(contour(iso));
        ctx.strokeStyle = major ? `rgba(${INK}, 0.30)` : `rgba(${INK}, ${PAL.minor})`;
        ctx.lineWidth = major ? 1.15 : 0.8;
        ctx.beginPath();
        for (const { pts } of lines) {
          ctx.moveTo(pts[0][0], pts[0][1]);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
        }
        ctx.stroke();
        if (major) majors = majors.concat(lines);
      }
      updateLabels(majors, now, instant);
      drawLabels();
      updatePoints(now, instant, majors);
      drawPoints(now);
    }

    function frame(now) {
      raf = requestAnimationFrame(frame);
      if (now - last < 1000 / FPS) return;
      last = now;
      if (window.scrollY > h) return;          // héro hors champ : on ne dessine pas
      if (++ticks % 12 === 0) measureHero();   // les blocs protégés peuvent bouger (apparitions, animations)
      draw((now - t0) * SPEED, now);
    }
    function start() { if (!raf) { last = 0; raf = requestAnimationFrame(frame); } }
    function stop() { cancelAnimationFrame(raf); raf = 0; }

    resize(); measureHero();
    // sur mobile, la barre d'adresse provoque des « resize » en défilant : on ne recompose que si la taille change vraiment
    window.addEventListener("resize", () => {
      syncHeight();
      if (canvas.clientWidth === w && Math.abs(canvas.clientHeight - h) < 2) return;
      resize(); measureHero(); if (reduce) draw(0, performance.now(), true);
    });
    if (reduce) { draw(0, performance.now(), true); return; }
    document.addEventListener("visibilitychange", () => (document.hidden ? stop() : start()));
    start();
  })();
</script>
</body>
